name: Deploy STN website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate static site
        run: |
          set -euo pipefail
          test -s assets/css/site.css
          test -s assets/js/site.js
          test -s assets/brand/stn-logo-original.png
          grep -q '<title>Supportive Therapy Network' index.html
          for page in index.html about.html approach.html services.html assessments.html safety.html legal.html contact.html; do
            test -s "$page"
            grep -q 'name="viewport"' "$page"
            grep -q 'class="navlinks"' "$page"
            grep -q 'aria-current="page"' "$page"
            grep -q 'href="tel:1737"' "$page"
            grep -q 'assets/css/site.css' "$page"
          done
          grep -q 'id="contact"' contact.html
          grep -q 'id="privacy"' legal.html
          grep -q 'not yet accepting referrals' services.html
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
