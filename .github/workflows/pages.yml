name: Deploy STN website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Validate static site
        run: |
          set -euo pipefail
          test -s assets/css/site.css
          test -s assets/js/site.js
          test -s assets/brand/stn-logo-original.png
          grep -q '<title>Supportive Therapy Network' index.html
          for page in index.html about.html approach.html services.html assessments.html safety.html legal.html contact.html support.html partnerships.html; do
            test -s "$page"
            grep -q 'name="viewport"' "$page"
            grep -q 'class="navlinks"' "$page"
            grep -q 'aria-current="page"' "$page"
            grep -q 'href="tel:1737"' "$page"
            grep -q 'assets/css/site.css' "$page"
          done
          grep -q 'id="contact"' contact.html
          grep -q 'id="privacy"' legal.html
          grep -q 'not yet accepting referrals' services.html
          grep -q 'not a registered charity' support.html
          grep -q 'partnership@supportivetherapy.network' partnerships.html
      - name: Assemble allow-listed public site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          for page in index.html about.html approach.html services.html assessments.html safety.html legal.html contact.html support.html partnerships.html 404.html; do
            test -s "$page"
            cp "$page" _site/
          done
          cp -R assets _site/assets
          cp robots.txt sitemap.xml _site/
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          test ! -e _site/README.md
          test ! -e _site/PRIVACY-NOTICE-DRAFT.md
          find _site -type f -print | sort
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
