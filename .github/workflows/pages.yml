name: Deploy STN website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Validate static site
        run: |
          set -euo pipefail
          test -s assets/css/site.css
          test -s assets/js/site.js
          test -s assets/brand/stn-logo-original.png
          grep -q '<title>Supportive Therapy Network' index.html
          for page in index.html about.html approach.html services.html assessments.html safety.html legal.html contact.html support.html investors.html; do
            test -s "$page"
            grep -q 'name="viewport"' "$page"
            grep -q 'class="navlinks"' "$page"
            grep -q 'aria-current="page"' "$page"
            grep -q 'href="tel:1737"' "$page"
            grep -q 'assets/css/site.css' "$page"
          done
          grep -q 'id="contact"' contact.html
          grep -q 'id="privacy"' legal.html
          grep -q 'not yet accepting referrals' services.html
          grep -q 'not a registered charity' support.html
          grep -q 'Financial Markets Conduct Act 2013' investors.html
      - name: Assemble only the public files (no drafts, docs or repository files)
        run: |
          set -euo pipefail
          test -s robots.txt && test -s sitemap.xml && test -s 404.html
          mkdir _site
          cp ./*.html CNAME robots.txt sitemap.xml _site/
          cp -R assets _site/assets
          if find _site -type f ! \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.png' -o -name '*.svg' \
               -o -name '*.ico' -o -name '*.woff2' -o -name 'CNAME' -o -name 'robots.txt' -o -name 'sitemap.xml' \) | grep .; then
            echo "Unexpected file type in the public site (listed above)." >&2
            exit 1
          fi
          echo "Publishing $(find _site -type f | wc -l) files."
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
